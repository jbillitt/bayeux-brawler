<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotlin Path Vector Builder</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #2c2c2c; color: white; }
        canvas { background: #fff; border: 1px solid #000; cursor: crosshair; }
        .controls { margin-top: 10px; display: flex; gap: 10px; }
        textarea { width: 600px; height: 150px; margin-top: 10px; font-family: monospace; }
        button { padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Bayeux Vector Builder</h1>
    <canvas id="canvas" width="600" height="600"></canvas>
    <div class="controls">
        <button id="clearBtn">Clear</button>
        <button id="undoBtn">Undo</button>
        <label>Snap to Grid: <input type="checkbox" id="snapCheck" checked></label>
    </div>
    <textarea id="output" readonly></textarea>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        const clearBtn = document.getElementById('clearBtn');
        const undoBtn = document.getElementById('undoBtn');
        const snapCheck = document.getElementById('snapCheck');

        let paths = [];
        let currentPath = [];

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
            // Draw axis
            ctx.strokeStyle = '#ccc';
            ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
        }

        function draw() {
            drawGrid();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            
            paths.forEach(path => {
                if (path.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x, path[i].y);
                }
                ctx.stroke();
                // Draw points
                ctx.fillStyle = 'red';
                path.forEach(pt => {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            if (currentPath.length > 0) {
                ctx.beginPath();
                ctx.moveTo(currentPath[0].x, currentPath[0].y);
                for (let i = 1; i < currentPath.length; i++) {
                    ctx.lineTo(currentPath[i].x, currentPath[i].y);
                }
                ctx.stroke();
                ctx.fillStyle = 'red';
                currentPath.forEach(pt => {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            updateOutput();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            if (snapCheck.checked) {
                x = Math.round(x / 10) * 10;
                y = Math.round(y / 10) * 10;
            }
            return { x, y };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            currentPath = [pos];
            draw();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) { // Left click held
                const pos = getMousePos(e);
                // Avoid duplicates
                if (currentPath.length > 0) {
                    const last = currentPath[currentPath.length - 1];
                    if (last.x === pos.x && last.y === pos.y) return;
                }
                currentPath.push(pos);
                draw();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (currentPath.length > 0) {
                paths.push(currentPath);
                currentPath = [];
                draw();
            }
        });

        clearBtn.addEventListener('click', () => {
            paths = [];
            draw();
        });

        undoBtn.addEventListener('click', () => {
            if (paths.length > 0) {
                paths.pop();
                draw();
            }
        });

        function updateOutput() {
            if (paths.length === 0) {
                output.value = "Path().apply {\n}";
                return;
            }
            
            let code = "Path().apply {\n";
            // Map coordinates relative to center
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            paths.forEach(path => {
                if (path.length === 0) return;
                code += `    moveTo(${path[0].x - cx}f, ${path[0].y - cy}f)\n`;
                for (let i = 1; i < path.length; i++) {
                    code += `    lineTo(${path[i].x - cx}f, ${path[i].y - cy}f)\n`;
                }
            });
            code += "}";
            output.value = code;
        }

        draw();
    </script>
</body>
</html>
